# Local development database (Blueprint ARCH-004).
#
#   docker compose up -d --wait   start PostgreSQL 16 + PostGIS + pgvector
#   pnpm db:migrate               apply the migrations
#
# The credentials below are for this local container only. It listens on
# 127.0.0.1:54329, so it is not reachable from other machines.
name: lilith

services:
  db:
    build:
      context: ./packages/db/docker
    image: lilith-db:pg16-postgis-pgvector
    environment:
      POSTGRES_USER: lilith
      POSTGRES_PASSWORD: lilith
      POSTGRES_DB: lilith
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the server that runs during first-time setup listens on the
      # socket only, so this passes once the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lilith -d lilith"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
